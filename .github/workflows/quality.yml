name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        # Dívida existente de lint é exibida no CI sem bloquear entregas
        # funcionais enquanto a migração incremental de tipos é concluída.
        continue-on-error: true
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
